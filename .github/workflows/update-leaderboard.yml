name: Update Leaderboard

on:
  schedule:
    # Runs at 00:05 UTC every day (midnight UK winter / 1am UK summer)
    - cron: '5 0 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch leaderboard data
        env:
          RAINBET_API_KEY: ${{ secrets.RAINBET_API_KEY }}
        run: node scripts/fetch-leaderboard.mjs

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: update leaderboard data [skip ci]"
          git push
